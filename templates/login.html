{% extends "base.html" %}
{% block title %}Log In — Zanite{% endblock %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">Z</span>
      <span class="brand-name">Zanite Business Manager</span>
    </div>
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to manage your business.</p>
    <form method="POST" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email address
        <input type="email" name="email" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="remember">
        Remember me
      </label>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
  </div>
</div>
{% endblock %}
