{% extends "base.html" %}
{% block title %}Create Account — Zanite{% endblock %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card auth-card-wide">
    <div class="auth-brand">
      <span class="brand-mark">Z</span>
      <span class="brand-name">Zanite Business Manager</span>
    </div>
    <h1>Set up your business</h1>
    <p class="auth-subtitle">One platform for sales, stock, expenses and debts.</p>
    <form method="POST" class="auth-form auth-form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Business name
        <input type="text" name="business_name" required>
      </label>
      <label>Owner name
        <input type="text" name="owner_name" required>
      </label>
      <label>Phone number
        <input type="tel" name="phone">
      </label>
      <label>Email address
        <input type="email" name="email" required>
      </label>
      <label>Business type
        <select name="business_type">
          <option value="Retail Shop">Retail Shop</option>
          <option value="Mini-Supermarket">Mini-Supermarket</option>
          <option value="Boutique">Boutique</option>
          <option value="Electronics Shop">Electronics Shop</option>
          <option value="Beauty & Cosmetics">Beauty &amp; Cosmetics</option>
          <option value="Hardware Shop">Hardware Shop</option>
          <option value="Restaurant">Restaurant / Food Business</option>
          <option value="Salon / Barbershop">Salon / Barbershop</option>
          <option value="Wholesaler">Wholesaler</option>
          <option value="Online Seller">Online Seller</option>
          <option value="Service Business">Service Business</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <label>Location
        <input type="text" name="location" placeholder="e.g. Nairobi, Kenya">
      </label>
      <label>Currency
        <select name="currency">
          <option value="KES">KES — Kenyan Shilling</option>
          <option value="UGX">UGX — Ugandan Shilling</option>
          <option value="TZS">TZS — Tanzanian Shilling</option>
          <option value="NGN">NGN — Nigerian Naira</option>
          <option value="GHS">GHS — Ghanaian Cedi</option>
          <option value="ZAR">ZAR — South African Rand</option>
          <option value="USD">USD — US Dollar</option>
        </select>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <label>Confirm password
        <input type="password" name="confirm_password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block full-width">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
